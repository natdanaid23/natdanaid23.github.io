<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Basketball Control</title>
<style>
  :root{--bg:#171a23;--p:#232836;--t:#f2f4f8;--a:#ffb400}
  *{box-sizing:border-box}
  body{margin:0;padding:10px;background:var(--bg);color:var(--t);font:13px "Segoe UI",Tahoma,sans-serif}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
  .card{background:var(--p);border-radius:8px;padding:8px}
  .c{text-align:center}
  h4{margin:0 0 6px;font-size:12px;opacity:.7;font-weight:600}
  input[type=text],input[type=number]{padding:5px;border-radius:5px;border:0;background:#fff;color:#111;width:100%}
  input[type=color]{width:100%;height:26px;border:0;background:none;margin-top:4px}
  .big{font-size:44px;font-weight:700;line-height:1.1}
  button{padding:6px 9px;border:0;border-radius:6px;background:#3a4258;color:var(--t);cursor:pointer;margin:2px;font-size:13px}
  button:hover{background:#4b5572}
  button.p{background:var(--a);color:#111;font-weight:700}
  button.on{background:#2e9e5b}
  .clock{font-size:36px;font-weight:700;font-variant-numeric:tabular-nums}
  .inl{display:flex;gap:6px;align-items:center;margin-top:4px}
  .inl input[type=number]{width:60px}
  .logo{width:48px;height:48px;object-fit:contain;background:#0003;border-radius:6px;display:block;margin:4px auto}
  label{font-size:12px}
  small{opacity:.6}
</style>
</head>
<body>
<div class="grid">
  <div class="card c" id="cardA"></div>
  <div class="card c" id="cardB"></div>
</div>

<div class="card c" style="margin-bottom:8px">
  <h4>นาฬิกาเกม</h4>
  <div class="clock" id="clk">10:00</div> <span id="qlbl" style="font-weight:700;color:var(--a)"></span>
  <div>
    <button class="p" id="toggle">เริ่ม / หยุด (Space)</button>
    <button data-g="-1000">−1s</button><button data-g="1000">+1s</button><button data-g="-10000">−10s</button><button data-g="10000">+10s</button>
  </div>
  <div class="inl" style="justify-content:center">ตั้งเวลา <input type="number" id="setM" min="0" value="10"> : <input type="number" id="setS" min="0" max="59" value="0"> <button id="setT">ตั้ง</button></div>
  <div style="margin-top:6px">
    <button id="prevQ">◀ ช่วงก่อน</button><button class="p" id="nextQ">ช่วงถัดไป ▶</button>
  </div>
  <div class="inl" style="justify-content:center">
    <label>Q ยาว <input type="number" id="qLen" min="1" value="10"> นาที</label>
    <label>OT ยาว <input type="number" id="otLen" min="1" value="5"> นาที</label>
  </div>
</div>

<div class="grid">
  <div class="card c">
    <h4>Shot clock</h4>
    <div class="clock" id="shotv">24</div>
    <button class="p" data-sh="24000">24 (R)</button><button data-sh="14000">14 (T)</button>
    <button data-sa="-1000">−1</button><button data-sa="1000">+1</button>
    <div><label><input type="checkbox" id="showShot"> แสดง Shot clock</label></div>
  </div>
  <div class="card c">
    <h4>ลูกได้ครอบครอง (Possession)</h4>
    <button id="posA"></button><button id="posN">ไม่ระบุ</button><button id="posB"></button>
    <h4 style="margin-top:8px">เกณฑ์ BONUS (ฟาวล์ทีม)</h4>
    <input type="number" id="bonusAt" min="1" value="5" style="width:70px">
    <div><label><input type="checkbox" id="resetFouls" checked> ล้างฟาวล์เมื่อเปลี่ยนช่วง (ไม่ล้างใน OT ถ้าติ๊กออก)</label></div>
    <div><label>จำนวน Timeout ต่อทีม <input type="number" id="toTotal" min="1" max="8" value="5" style="width:60px"></label></div>
  </div>
</div>

<div class="card c" style="margin-bottom:8px">
  <h4>ข้อความขึ้นจอ (เช่น TIMEOUT, FINAL)</h4>
  <input type="text" id="msg" placeholder="พิมพ์ข้อความ...">
  <button class="p" id="msgShow">แสดง/ซ่อน</button>
  <button data-m="TIMEOUT">TIMEOUT</button><button data-m="END OF QUARTER">END OF QUARTER</button><button data-m="HALFTIME">HALFTIME</button><button data-m="FINAL">FINAL</button>
</div>

<div class="card c">
  <button id="vis" class="on">แสดงสกอร์บอร์ด</button>
  <button id="swap">สลับทีม</button>
  <button id="resetAll">รีเซ็ตเกมใหม่</button>
  <div><small>คีย์ลัด: Q/W/E = ทีม A +1/+2/+3 · I/O/P = ทีม B +1/+2/+3 · Space เริ่ม/หยุด · R/T = Shot 24/14</small></div>
</div>

<script>
const KEY="bb_state",$=id=>document.getElementById(id);
const ch=("BroadcastChannel" in window)?new BroadcastChannel("bb_scoreboard"):null;
const def={nameA:"HOME",nameB:"AWAY",colorA:"#e63946",colorB:"#1d8cf8",logoA:"",logoB:"",
  scoreA:0,scoreB:0,foulsA:0,foulsB:0,toA:5,toB:5,toTotal:5,bonusAt:5,q:1,qLen:600000,otLen:300000,
  gameMs:600000,shotMs:24000,running:false,startedAt:0,showShot:true,poss:"",msg:"",msgOn:false,visible:true,resetFouls:true};
let S;try{S=Object.assign({},def,JSON.parse(localStorage.getItem(KEY)))}catch(e){S={...def}}

function left(b){return S.running?Math.max(0,b-(Date.now()-S.startedAt)):b}
function freeze(){if(S.running){S.gameMs=left(S.gameMs);S.shotMs=left(S.shotMs);S.startedAt=Date.now()}}
function save(){localStorage.setItem(KEY,JSON.stringify(S));if(ch)ch.postMessage(S);ui()}
function fmt(ms){const s=Math.ceil(ms/1000);return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")}
function qLabel(q){return q<=4?"Q"+q:"OT"+(q-4)}
function clamp(v,a,b){return Math.min(b,Math.max(a,v))}

function teamCard(t){
  $("card"+t).innerHTML=
   '<input type="text" data-k="name'+t+'" placeholder="ชื่อทีม '+t+'">'+
   '<input type="color" data-k="color'+t+'">'+
   '<img class="logo" id="img'+t+'" alt="">'+
   '<input type="file" accept="image/*" data-logo="'+t+'" style="width:100%;font-size:11px">'+
   '<input type="text" data-k="logo'+t+'" placeholder="หรือใส่ URL โลโก้ (เช่น logos/a.png)" style="margin-top:4px">'+
   '<button data-clr="'+t+'" style="font-size:11px">ลบโลโก้</button>'+
   '<div class="big" id="sc'+t+'">0</div>'+
   '<button class="p" data-s="'+t+'" data-d="1">+1</button><button data-s="'+t+'" data-d="2">+2</button><button data-s="'+t+'" data-d="3">+3</button><button data-s="'+t+'" data-d="-1">−1</button>'+
   '<div style="margin-top:6px">ฟาวล์ <b id="fo'+t+'">0</b> <button data-f="'+t+'" data-d="1">+</button><button data-f="'+t+'" data-d="-1">−</button></div>'+
   '<div>Timeout เหลือ <b id="tm'+t+'">0</b> <button class="p" data-t="'+t+'" data-d="-1">ใช้</button><button data-t="'+t+'" data-d="1">+</button></div>';
}
teamCard("A");teamCard("B");

function ui(){
  for(const t of ["A","B"]){
    $("sc"+t).textContent=S["score"+t];$("fo"+t).textContent=S["fouls"+t];$("tm"+t).textContent=S["to"+t];
    $("img"+t).src=S["logo"+t]||"";
  }
  $("clk").textContent=fmt(left(S.gameMs));$("qlbl").textContent=qLabel(S.q);
  $("shotv").textContent=Math.ceil(left(S.shotMs)/1000);
  $("toggle").classList.toggle("on",S.running);
  $("posA").textContent="◀ "+S.nameA;$("posB").textContent=S.nameB+" ▶";
  $("posA").classList.toggle("on",S.poss==="A");$("posB").classList.toggle("on",S.poss==="B");$("posN").classList.toggle("on",S.poss==="");
  $("vis").classList.toggle("on",S.visible);$("vis").textContent=S.visible?"ซ่อนสกอร์บอร์ด":"แสดงสกอร์บอร์ด";
  $("msgShow").classList.toggle("on",S.msgOn);
}
function init(){
  document.querySelectorAll("[data-k]").forEach(e=>e.value=S[e.dataset.k]);
  $("showShot").checked=S.showShot;$("bonusAt").value=S.bonusAt;$("toTotal").value=S.toTotal;
  $("qLen").value=S.qLen/60000;$("otLen").value=S.otLen/60000;$("resetFouls").checked=S.resetFouls;$("msg").value=S.msg;
  const g=Math.ceil(S.gameMs/1000);$("setM").value=Math.floor(g/60);$("setS").value=g%60;ui();
}
function toggle(){
  if(S.running){freeze();S.running=false}
  else if(S.gameMs>0&&S.shotMs>0){S.running=true;S.startedAt=Date.now()}
  save();
}
function score(t,d){S["score"+t]=Math.max(0,S["score"+t]+d);save()}
function shotSet(ms){freeze();S.shotMs=Math.min(ms,Math.max(S.gameMs,0)||ms);S.shotMs=ms;save()}
function goQuarter(q){
  freeze();S.running=false;S.q=Math.max(1,q);
  S.gameMs=S.q<=4?S.qLen:S.otLen;S.shotMs=24000;
  if(S.resetFouls&&(S.q<=4||true)){S.foulsA=0;S.foulsB=0}
  S.toA=S.toA;save();init();
}

document.addEventListener("input",e=>{
  const k=e.target.dataset.k;if(k){S[k]=e.target.value;save()}
});
document.addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;const d=b.dataset;
  if(d.s)score(d.s,+d.d);
  if(d.f){S["fouls"+d.f]=Math.max(0,S["fouls"+d.f]+ +d.d);save()}
  if(d.t){S["to"+d.t]=clamp(S["to"+d.t]+ +d.d,0,S.toTotal);save()}
  if(d.clr){S["logo"+d.clr]="";document.querySelector('[data-k="logo'+d.clr+'"]').value="";save()}
  if(d.g){freeze();S.gameMs=Math.max(0,S.gameMs+ +d.g);save();init()}
  if(d.sh)shotSet(+d.sh);
  if(d.sa){freeze();S.shotMs=Math.max(0,S.shotMs+ +d.sa);save()}
  if(d.m){S.msg=d.m;S.msgOn=true;$("msg").value=S.msg;save()}
});
$("toggle").onclick=toggle;
$("setT").onclick=()=>{freeze();S.gameMs=((+$("setM").value||0)*60+(+$("setS").value||0))*1000;save()};
$("nextQ").onclick=()=>goQuarter(S.q+1);$("prevQ").onclick=()=>goQuarter(S.q-1);
$("qLen").oninput=e=>{S.qLen=(+e.target.value||1)*60000;save()};
$("otLen").oninput=e=>{S.otLen=(+e.target.value||1)*60000;save()};
$("showShot").onchange=e=>{S.showShot=e.target.checked;save()};
$("bonusAt").oninput=e=>{S.bonusAt=+e.target.value||5;save()};
$("resetFouls").onchange=e=>{S.resetFouls=e.target.checked;save()};
$("toTotal").oninput=e=>{const n=clamp(+e.target.value||1,1,8);S.toTotal=n;S.toA=Math.min(S.toA,n);S.toB=Math.min(S.toB,n);save()};
$("posA").onclick=()=>{S.poss="A";save()};$("posB").onclick=()=>{S.poss="B";save()};$("posN").onclick=()=>{S.poss="";save()};
$("msg").addEventListener("input",e=>{S.msg=e.target.value;save()});
$("msgShow").onclick=()=>{S.msgOn=!S.msgOn;save()};
$("vis").onclick=()=>{S.visible=!S.visible;save()};
$("swap").onclick=()=>{for(const k of ["name","color","logo","score","fouls","to"]){[S[k+"A"],S[k+"B"]]=[S[k+"B"],S[k+"A"]]}save();init()};
$("resetAll").onclick=()=>{if(confirm("รีเซ็ตเกมใหม่? (ชื่อทีม/โลโก้/สีจะคงไว้)")){
  Object.assign(S,{scoreA:0,scoreB:0,foulsA:0,foulsB:0,toA:S.toTotal,toB:S.toTotal,q:1,gameMs:S.qLen,shotMs:24000,running:false,poss:"",msg:"",msgOn:false});save();init()}};

// Logo upload: resize to <=200px, store as data URL
document.addEventListener("change",e=>{
  const t=e.target.dataset.logo;if(!t||!e.target.files[0])return;
  const img=new Image(),url=URL.createObjectURL(e.target.files[0]);
  img.onload=()=>{
    const r=Math.min(1,200/Math.max(img.width,img.height)),c=document.createElement("canvas");
    c.width=Math.round(img.width*r);c.height=Math.round(img.height*r);
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    S["logo"+t]=c.toDataURL("image/png");URL.revokeObjectURL(url);
    document.querySelector('[data-k="logo'+t+'"]').value="";save();
  };img.src=url;
});

// Keyboard shortcuts
document.addEventListener("keydown",e=>{
  if(/INPUT|TEXTAREA/.test(e.target.tagName)&&e.target.type!=="checkbox")return;
  const k=e.key.toLowerCase();
  if(e.code==="Space"){e.preventDefault();toggle()}
  else if(k==="q")score("A",1);else if(k==="w")score("A",2);else if(k==="e")score("A",3);
  else if(k==="i")score("B",1);else if(k==="o")score("B",2);else if(k==="p")score("B",3);
  else if(k==="r")shotSet(24000);else if(k==="t")shotSet(14000);
});

// Auto-stop at zero (buzzer) + live display
setInterval(()=>{
  if(S.running&&(left(S.gameMs)<=0||left(S.shotMs)<=0)){
    S.gameMs=left(S.gameMs);S.shotMs=left(S.shotMs);S.running=false;save();
  }else ui();
},100);
init();save();
</script>
</body>
</html>
