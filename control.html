<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Scoreboard Control</title>
<style>
  :root{--bg:#1b1f2a;--panel:#252b3a;--text:#f2f4f8;--accent:#ffb400}
  *{box-sizing:border-box}
  body{margin:0;padding:12px;background:var(--bg);color:var(--text);font:14px "Segoe UI",sans-serif}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
  .card{background:var(--panel);border-radius:8px;padding:10px;text-align:center}
  input[type=text]{width:100%;padding:6px;border-radius:5px;border:0;background:#fff;color:#111}
  input[type=color]{width:100%;height:28px;border:0;margin-top:6px;background:none}
  .big{font-size:48px;font-weight:700;margin:6px 0}
  button{padding:8px 12px;border:0;border-radius:6px;background:#3a4258;color:var(--text);cursor:pointer;font-size:14px;margin:2px}
  button:hover{background:#4b5572}
  button.p{background:var(--accent);color:#111;font-weight:600}
  label{display:block;font-size:12px;opacity:.8;margin:6px 0 2px}
  #timer{font-size:40px;font-variant-numeric:tabular-nums;font-weight:600}
</style>
</head>
<body>
<div class="row">
  <div class="card">
    <input type="text" id="nameA" placeholder="ทีม A"><input type="color" id="colorA">
    <div class="big" id="scoreA">0</div>
    <button class="p" data-s="A" data-d="1">+1</button><button data-s="A" data-d="2">+2</button><button data-s="A" data-d="3">+3</button><button data-s="A" data-d="-1">−1</button>
  </div>
  <div class="card">
    <input type="text" id="nameB" placeholder="ทีม B"><input type="color" id="colorB">
    <div class="big" id="scoreB">0</div>
    <button class="p" data-s="B" data-d="1">+1</button><button data-s="B" data-d="2">+2</button><button data-s="B" data-d="3">+3</button><button data-s="B" data-d="-1">−1</button>
  </div>
</div>
<div class="card" style="margin-bottom:10px">
  <div id="timer">00:00</div>
  <button class="p" id="start">เริ่ม</button><button id="pause">หยุด</button><button id="reset">รีเซ็ตเวลา</button>
  <label><input type="checkbox" id="countdown"> นับถอยหลัง จาก <input type="number" id="limit" value="10" min="0" style="width:60px"> นาที</label>
  <label>ช่วง/ครึ่ง <input type="text" id="period" placeholder="เช่น ครึ่งแรก / Q1" style="width:60%"></label>
</div>
<button id="resetAll">รีเซ็ตทั้งหมด</button>
<script>
const KEY="scoreboard_state", ch=("BroadcastChannel" in window)?new BroadcastChannel("scoreboard"):null;
const def={nameA:"HOME",nameB:"AWAY",colorA:"#e63946",colorB:"#1d8cf8",scoreA:0,scoreB:0,period:"1st",
  running:false,base:0,startedAt:0,countdown:false,limit:600000};
let S;try{S=Object.assign({},def,JSON.parse(localStorage.getItem(KEY)))}catch(e){S={...def}}
const $=id=>document.getElementById(id);
function el(){return S.running?S.base+(Date.now()-S.startedAt):S.base}
function save(){localStorage.setItem(KEY,JSON.stringify(S));if(ch)ch.postMessage(S);ui()}
function fmt(ms){const s=Math.max(0,Math.floor(ms/1000));return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")}
function ui(){
  $("scoreA").textContent=S.scoreA;$("scoreB").textContent=S.scoreB;
  $("timer").textContent=fmt(S.countdown?S.limit-el():el());
}
function init(){
  for(const k of ["nameA","nameB","colorA","colorB","period"])$(k).value=S[k];
  $("countdown").checked=S.countdown;$("limit").value=Math.round(S.limit/60000);ui();
}
for(const k of ["nameA","nameB","colorA","colorB","period"])$(k).oninput=e=>{S[k]=e.target.value;save()};
$("countdown").onchange=e=>{S.countdown=e.target.checked;save()};
$("limit").oninput=e=>{S.limit=(+e.target.value||0)*60000;save()};
document.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{
  const k="score"+b.dataset.s;S[k]=Math.max(0,S[k]+ +b.dataset.d);save()});
$("start").onclick=()=>{if(!S.running){S.running=true;S.startedAt=Date.now();save()}};
$("pause").onclick=()=>{if(S.running){S.base=el();S.running=false;save()}};
$("reset").onclick=()=>{S.base=0;S.running=false;save()};
$("resetAll").onclick=()=>{if(confirm("รีเซ็ตทั้งหมด?")){S={...def};init();save()}};
setInterval(()=>{ui();if(S.running)save()},1000);
init();save();
</script>
</body>
</html>
