<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>Scoreboard Overlay</title>
<style>
  html,body{margin:0;background:transparent;overflow:hidden;font-family:"Kanit","Segoe UI",sans-serif}
  #board{position:absolute;top:30px;left:30px;display:flex;align-items:stretch;height:84px;
    background:#14171f;color:#fff;border-radius:10px;overflow:hidden;box-shadow:0 6px 20px rgba(0,0,0,.45)}
  .team{display:flex;align-items:center;gap:16px;padding:0 22px;min-width:200px}
  .team .bar{width:8px;align-self:stretch}
  .team.b{flex-direction:row-reverse}
  .name{font-size:30px;font-weight:600;letter-spacing:1px}
  .score{width:84px;display:flex;align-items:center;justify-content:center;font-size:54px;font-weight:700;background:#fff;color:#14171f}
  .mid{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 18px;background:#232836;min-width:110px}
  #period{font-size:15px;opacity:.75}
  #timer{font-size:34px;font-weight:600;font-variant-numeric:tabular-nums}
  .pop{animation:pop .35s}
  @keyframes pop{50%{transform:scale(1.25)}}
</style>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
<div id="board">
  <div class="team a"><div class="bar" id="ca"></div><div class="name" id="na"></div></div>
  <div class="score" id="sa">0</div>
  <div class="mid"><div id="period"></div><div id="timer">00:00</div></div>
  <div class="score" id="sb">0</div>
  <div class="team b"><div class="bar" id="cb"></div><div class="name" id="nb"></div></div>
</div>
<script>
const KEY="scoreboard_state", ch=("BroadcastChannel" in window)?new BroadcastChannel("scoreboard"):null;
let S=null, prev={};
function fmt(ms){const s=Math.max(0,Math.floor(ms/1000));return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")}
function elapsed(){return S.running?S.base+(Date.now()-S.startedAt):S.base}
function shown(){let t=S.countdown?S.limit-elapsed():elapsed();return S.countdown?Math.max(0,t):t}
function render(){
  if(!S)return;
  for(const [k,id] of [["scoreA","sa"],["scoreB","sb"]]){
    const el=document.getElementById(id);
    if(prev[k]!==undefined&&prev[k]!==S[k]){el.classList.remove("pop");void el.offsetWidth;el.classList.add("pop")}
    el.textContent=S[k];prev[k]=S[k];
  }
  na.textContent=S.nameA;nb.textContent=S.nameB;
  ca.style.background=S.colorA;cb.style.background=S.colorB;
  period.textContent=S.period;timer.textContent=fmt(shown());
}
function load(){try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}render()}
if(ch)ch.onmessage=e=>{S=e.data;render()};
window.addEventListener("storage",e=>{if(e.key===KEY)load()});
load();setInterval(()=>{load()},1000);setInterval(render,200);
</script>
</body>
</html>
